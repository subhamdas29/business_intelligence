[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aibi-backend"
version = "0.1.0"
description = "Production-grade AI Business Intelligence SaaS Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI BI Platform Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "pandas>=2.2.1",
    "polars>=0.20.15",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.1.post1",
    "pgvector>=0.2.5",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sqlglot>=23.0.0",
    "sqlparse>=0.4.4",
    "openpyxl>=3.1.2",
    "reportlab>=4.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
